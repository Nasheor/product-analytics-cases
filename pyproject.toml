[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "product-analytics-cases"
version = "0.1.0"
description = "Three product-analytics case studies on public data: funnel and retention, experiment read-out, metric-definition review"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Avinash Nagarajan" }]
dependencies = [
    "duckdb",
    "pandas",
    "pyarrow",
    "numpy",
    "scipy",
    "statsmodels",
    "matplotlib",
    "jupytext",
    "nbconvert",
    "nbformat",
    "ipykernel",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]
llm = ["anthropic>=0.40", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
extend-exclude = ["cases/*/notebook.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B905"]
